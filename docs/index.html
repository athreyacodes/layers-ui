<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Layers UI Demo</title>
  <link rel="stylesheet" href="layers/layers.css" />
  <link rel="icon" type="image/png" href="favicon.ico" />
</head>

<body class="p-3 m-0">
  <div class="wave3-container">
    <div class="blur slow">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <div id="theme-toggle" class="layers-icon-container d-flex items-center justify-center d-gap-5 m-5 p-5 flex-col c-pointer" title="Toggle light / dark mode" role="button" tabindex="0" aria-label="Toggle light and dark mode">
    <div class="layer-icon-group large animate p-0 mr-2 mb-2 title-icon">
      <div class="layer layer1"></div>
      <div class="layer layer2"></div>
      <div class="layer layer3"></div>
    </div>

    <div class="title-text-wrapper">
      <div class="title-text text-wide font-bolder">LAYERS</div>
    </div>
  </div>

  <script>
    (function () {
      var body = document.body;
      var toggle = document.getElementById('theme-toggle');
      var storageKey = 'layers-ui-theme';

      function applyTheme(theme) {
        if (theme === 'dark') {
          body.classList.add('color-scheme-dark');
        } else {
          body.classList.remove('color-scheme-dark');
        }
        try {
          sessionStorage.setItem(storageKey, theme);
        } catch (e) { }
      }

      function currentTheme() {
        return body.classList.contains('color-scheme-dark') ? 'dark' : 'light';
      }

      function toggleTheme() {
        applyTheme(currentTheme() === 'dark' ? 'light' : 'dark');
      }

      try {
        var saved = sessionStorage.getItem(storageKey);
        if (saved === 'dark' || saved === 'light') {
          applyTheme(saved);
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          applyTheme('dark');
        }
      } catch (e) { }

      if (toggle) {
        toggle.addEventListener('click', toggleTheme);
        toggle.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            toggleTheme();
          }
        });
      }
    })();
  </script>
</body>

</html>
